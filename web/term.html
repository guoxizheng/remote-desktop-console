<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>终端 · 远程桌面控制台</title>
<link rel="stylesheet" href="/vendor/xterm/xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #0b0f17; color: #d7e1f2;
    font-family: system-ui, "Microsoft YaHei", sans-serif; overflow: hidden; }
  #bar { display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: #111827; border-bottom: 1px solid #23304a; font-size: 13px; }
  #bar b { font-weight: 600; }
  #bar .sp { flex: 1; }
  #bar a { color: #6ea8fe; text-decoration: none; }
  #bar a:hover { text-decoration: underline; }
  #status { color: #7c8aa5; font-size: 12px; }
  #status.on { color: #4ade80; }
  #status.err { color: #f87171; }
  #wrap { position: absolute; top: 41px; left: 0; right: 0; bottom: 0; padding: 4px; }
  #term { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="bar">
  <b>🖥️ 终端</b>
  <span id="status">连接中…</span>
  <span class="sp"></span>
  <a href="/">← 返回控制台</a>
</div>
<div id="wrap"><div id="term"></div></div>
<script src="/vendor/xterm/xterm.js"></script>
<script>
  const qs = new URLSearchParams(location.search);
  const TOKEN = qs.get('token') || localStorage.getItem('rdc_token') || '';
  if (TOKEN) document.cookie = 'rdc_token=' + TOKEN + '; path=/';

  const statusEl = document.getElementById('status');
  const setStatus = (text, cls) => {
    statusEl.textContent = text;
    statusEl.className = cls || '';
  };

  const term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: 'ui-monospace, Menlo, Consolas, "DejaVu Sans Mono", monospace',
    scrollback: 8000,
    allowProposedApi: true,
    theme: {
      background: '#0b0f17', foreground: '#d7e1f2', cursor: '#6ea8fe',
      selectionBackground: '#33415c'
    }
  });
  term.open(document.getElementById('term'));
  term.focus();

  const wrap = document.getElementById('wrap');
  const proto = location.protocol === 'https:' ? 'wss://' : 'ws://';
  const wsUrl = proto + location.host + '/ws/term' +
                (TOKEN ? '?token=' + encodeURIComponent(TOKEN) : '');
  let ws = null, timer = null, alive = false, mode = 'pty';

  function measure() {
    const ctx = document.createElement('canvas').getContext('2d');
    ctx.font = '14px ui-monospace, Menlo, Consolas, monospace';
    const cw = ctx.measureText('W').width || 8.4;
    const ch = Math.round(14 * 1.25);
    return {
      cols: Math.max(20, Math.floor((wrap.clientWidth - 8) / cw)),
      rows: Math.max(6, Math.floor((wrap.clientHeight - 8) / ch))
    };
  }

  function sendResize() {
    if (!ws || ws.readyState !== 1) return;
    const { cols, rows } = measure();
    try { term.resize(cols, rows); } catch (e) {}
    try { ws.send(JSON.stringify({ cols, rows })); } catch (e) {}
  }

  function connect() {
    if (timer) { clearTimeout(timer); timer = null; }
    ws = new WebSocket(wsUrl);
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      alive = true;
      setStatus('已连接', 'on');
      sendResize();
      term.focus();
    };
    ws.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        try {
          const msg = JSON.parse(ev.data);
          if (msg.mode) {
            mode = msg.mode;
            if (mode === 'pipe') {
              setStatus('已连接 (无 PTY, 管道模式)', 'on');
              term.write('\r\n\x1b[33m[提示] 当前环境无 PTY, 已切换为管道模式: ' +
                         '支持普通命令, 不支持 vim/top 等全屏程序\x1b[0m\r\n');
            }
          }
        } catch (e) {}
        return;
      }
      term.write(new Uint8Array(ev.data));
    };
    ws.onclose = () => {
      alive = false;
      setStatus('已断开, 3 秒后重连…');
      timer = setTimeout(connect, 3000);
    };
    ws.onerror = () => setStatus('连接错误', 'err');
  }

  term.onData((data) => {
    if (!ws || ws.readyState !== 1) return;
    if (mode === 'pipe') {
      // 管道模式没有 tty 回显, 前端本地回显
      if (data === '\r') {
        term.write('\r\n');
        ws.send(new TextEncoder().encode('\n'));
      } else if (data === '\x7f') {
        term.write('\b \b');
        ws.send(new TextEncoder().encode('\x7f'));
      } else {
        term.write(data);
        ws.send(new TextEncoder().encode(data));
      }
    } else {
      ws.send(new TextEncoder().encode(data));
    }
  });

  window.addEventListener('resize', () => {
    if (timer) { clearTimeout(timer); timer = null; }
    timer = setTimeout(() => {
      timer = null;
      sendResize();
    }, 200);
  });

  connect();
</script>
</body>
</html>
